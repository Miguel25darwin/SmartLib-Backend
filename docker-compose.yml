services:
  db:
    image: postgres:16
    container_name: smartlib-postgres
    environment:
      POSTGRES_USER: smartlib_user
      POSTGRES_PASSWORD: smartlib_pass
      POSTGRES_DB: smartlib_db
    ports:
      - "5434:5432" # Utilise le port 5434 sur l'hôte pour éviter le conflit avec le postgres local
    volumes:
      - smartlib_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlib_user -d smartlib_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: smartlib-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://smartlib_user:smartlib_pass@db:5432/smartlib_db
      JWT_SECRET_KEY: change-moi-en-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES_CAMPUS: 480
      ACCESS_TOKEN_EXPIRE_MINUTES_REMOTE: 120
      LOAN_DURATION_DAYS: 14
      APP_NAME: SmartLib API
      APP_ENV: production
      API_V1_PREFIX: /api/v1
      SEED_SECRET_TOKEN: change-moi-avec-une-valeur-secrete-longue
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8080","http://localhost:5000","https://smartlib-frontend.onrender.com"]'
      UPLOAD_DIR: uploads/covers
      MAX_UPLOAD_SIZE_MB: 5

    ports:
      - "8000:8000"
    volumes:
      - smartlib_uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  smartlib_pgdata:
  smartlib_uploads:
